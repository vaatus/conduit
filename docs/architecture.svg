<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: MIT -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1280" height="600" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="40" y="40" font-size="20" font-weight="700" fill="#0f172a">Conduit — Shadow-AI Governance Architecture</text>
  <text x="40" y="60" font-size="12" fill="#475569">Browser-native interception · Lobster Trap inspection · Gemini classification + sanitization</text>

  <!-- Employee Laptop Zone -->
  <rect x="40" y="90" width="520" height="430" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="60" y="115" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.05em">EMPLOYEE LAPTOP</text>

  <!-- Browser node -->
  <rect x="60" y="130" width="480" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="155" font-size="13" font-weight="600" fill="#0f172a">Browser → public LLM</text>
  <text x="80" y="175" font-size="11" fill="#475569">chatgpt.com · claude.ai · gemini.google.com · copilot.microsoft.com · perplexity.ai</text>
  <text x="80" y="195" font-size="11" fill="#94a3b8">Paste events captured at the source</text>

  <!-- Extension node -->
  <rect x="60" y="230" width="480" height="270" rx="8" fill="#0f172a" stroke="#0f172a"/>
  <text x="80" y="255" font-size="13" font-weight="600" fill="#ffffff">Conduit MV3 Extension</text>
  <text x="80" y="275" font-size="11" fill="#cbd5e1">Vanilla JS · Shadow DOM · MIT</text>

  <g font-size="11" fill="#cbd5e1">
    <rect x="80" y="295" width="440" height="56" rx="6" fill="#1e293b"/>
    <text x="96" y="315" font-weight="600" fill="#fff">content.js</text>
    <text x="96" y="333" fill="#94a3b8">Intercepts paste · suspends · sends to background</text>

    <rect x="80" y="361" width="440" height="56" rx="6" fill="#1e293b"/>
    <text x="96" y="381" font-weight="600" fill="#fff">background.js</text>
    <text x="96" y="399" fill="#94a3b8">SHA-256 user pseudo-ID · POST /inspect · fail-open default</text>

    <rect x="80" y="427" width="440" height="56" rx="6" fill="#1e293b"/>
    <text x="96" y="447" font-weight="600" fill="#fff">modal.html / modal.css</text>
    <text x="96" y="465" fill="#94a3b8">Shadow-DOM modal: ALLOW toast · REDACT diff · BLOCK banner</text>
  </g>

  <!-- Arrow: browser → ext -->
  <path d="M300 210 L300 230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Corp cloud zone -->
  <rect x="600" y="90" width="640" height="430" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620" y="115" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.05em">CORP CLOUD (or self-hosted)</text>

  <!-- Backend -->
  <rect x="620" y="130" width="600" height="190" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="640" y="155" font-size="13" font-weight="600" fill="#0f172a">FastAPI Backend</text>
  <text x="640" y="173" font-size="11" fill="#475569">conduit/main.py · routes/inspect.py · models · async sqlite</text>

  <g font-size="11" fill="#0f172a">
    <rect x="640" y="190" width="270" height="115" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="654" y="210" font-weight="600">POST /inspect</text>
    <text x="654" y="228" fill="#475569">1 · Lobster Trap inspect (DPI)</text>
    <text x="654" y="244" fill="#475569">2 · If DENY → persist + return</text>
    <text x="654" y="260" fill="#475569">3 · Gemini classify (Flash)</text>
    <text x="654" y="276" fill="#475569">4 · Gemini sanitize (Pro)</text>
    <text x="654" y="292" fill="#475569">5 · persist event to SQLite</text>

    <rect x="930" y="190" width="280" height="115" rx="6" fill="#fff" stroke="#cbd5e1"/>
    <text x="944" y="210" font-weight="600">GET /events · /events/{id} · /stats</text>
    <text x="944" y="228" fill="#475569">Audit feed + stats for the CISO view</text>
    <text x="944" y="246" fill="#475569"></text>
    <text x="944" y="262" font-weight="600">POST /stats/narrative</text>
    <text x="944" y="280" fill="#475569">Daily summary via gemini-2.5-pro</text>
    <text x="944" y="298" fill="#475569">"This week your engineering team…"</text>
  </g>

  <!-- LT + Gemini + SQLite below -->
  <g>
    <rect x="620" y="340" width="180" height="160" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="640" y="365" font-size="13" font-weight="600" fill="#78350f">Lobster Trap</text>
    <text x="640" y="382" font-size="11" fill="#b45309">DPI proxy</text>
    <text x="640" y="402" font-size="11" fill="#92400e">policy.yaml</text>
    <text x="640" y="420" font-size="10" fill="#92400e">• ingress_rules</text>
    <text x="640" y="436" font-size="10" fill="#92400e">• egress_rules</text>
    <text x="640" y="452" font-size="10" fill="#92400e">• built-in detectors</text>
    <text x="640" y="468" font-size="10" fill="#92400e">• network policy</text>
    <text x="640" y="490" font-size="10" font-weight="600" fill="#78350f">Prize centerpiece</text>

    <rect x="820" y="340" width="180" height="160" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="840" y="365" font-size="13" font-weight="600" fill="#1e3a8a">Gemini</text>
    <text x="840" y="382" font-size="11" fill="#1d4ed8">via Lobster Trap</text>
    <text x="840" y="406" font-size="11" font-weight="600" fill="#1e3a8a">2.5 Flash</text>
    <text x="840" y="422" font-size="10" fill="#1d4ed8">classify (structured JSON)</text>
    <text x="840" y="446" font-size="11" font-weight="600" fill="#1e3a8a">2.5 Pro</text>
    <text x="840" y="462" font-size="10" fill="#1d4ed8">sanitize · narrate</text>
    <text x="840" y="488" font-size="10" font-weight="600" fill="#1e3a8a">No direct calls — CI enforced</text>

    <rect x="1020" y="340" width="200" height="160" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1040" y="365" font-size="13" font-weight="600" fill="#14532d">SQLite</text>
    <text x="1040" y="382" font-size="11" fill="#15803d">events.db</text>
    <text x="1040" y="408" font-size="10" fill="#166534">audit fields:</text>
    <text x="1040" y="424" font-size="10" fill="#166534">• decision · severity</text>
    <text x="1040" y="440" font-size="10" fill="#166534">• lt rule match</text>
    <text x="1040" y="456" font-size="10" fill="#166534">• categories · regulatory</text>
    <text x="1040" y="472" font-size="10" fill="#166534">• sanitized excerpt</text>
    <text x="1040" y="488" font-size="10" fill="#166534">• override flag</text>
  </g>

  <!-- Arrows backend → LT → Gemini → SQLite -->
  <path d="M775 305 L740 340" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="745" y="328" font-size="10" fill="#dc2626" font-weight="600">inspect</text>

  <path d="M800 420 L820 420" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="780" y="436" font-size="10" fill="#dc2626" font-weight="600">proxy</text>

  <path d="M1000 420 L1020 420" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow ext → backend, dashed across zones -->
  <path d="M540 360 C 570 360 580 250 620 250" stroke="#475569" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="560" y="265" font-size="10" fill="#475569" font-weight="600">/inspect</text>

  <!-- Dashboard ribbon at bottom -->
  <rect x="40" y="540" width="780" height="48" rx="8" fill="#0f172a"/>
  <text x="60" y="568" font-size="13" font-weight="600" fill="#ffffff">Dashboard (Next.js 14)</text>
  <text x="240" y="568" font-size="11" fill="#cbd5e1">Live feed · drill-in detail · adversarial test results · policy explorer · daily Gemini narrative</text>
  <text x="800" y="568" font-size="11" fill="#94a3b8" text-anchor="end">:3000</text>

  <!-- MCP server ribbon -->
  <rect x="830" y="540" width="410" height="48" rx="8" fill="#7c3aed"/>
  <text x="850" y="562" font-size="13" font-weight="600" fill="#ffffff">MCP Server</text>
  <text x="850" y="578" font-size="10" fill="#ede9fe">Conduit tools/resources for AI agents (Claude Desktop, copilots, bots)</text>
  <text x="1230" y="568" font-size="11" fill="#c4b5fd" text-anchor="end">stdio · :8765</text>
</svg>
